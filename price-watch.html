<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#121b2d"><title>Deal Hunter V3 · Price Watch</title><style>body{font:16px system-ui;background:#0e1524;color:#f4f7fb;max-width:760px;margin:auto;padding:18px}a{color:#ffcb77}input,button{font:inherit;border-radius:9px;padding:12px;margin:5px 0}input{width:100%;box-sizing:border-box;background:#18263a;color:white;border:1px solid #64748b}button{background:#ffbd59;color:#142033;border:0;font-weight:700;cursor:pointer}.panel{background:#1a2639;border:1px solid #35465f;border-radius:14px;padding:16px;margin:14px 0}.muted{color:#b5c2d4}.item{border-top:1px solid #40516a;padding:12px 0}label{display:block;margin-top:12px}#message{min-height:1.5em}</style></head><body><a href="./index.html">← Back to Deal Hunter V2.1</a><h1>📉 Deal Hunter V3 · Price Watch</h1><p class="muted">Record Amazon.ca product prices manually. No live prices, automatic alerts or verified discounts. Your data stays on this device.</p><div class="panel"><label>Product name<input id="name" placeholder="e.g. Cordless drill"></label><label>Amazon.ca product link<input id="url" placeholder="https://www.amazon.ca/dp/B012345678"></label><label>Price in CAD<input id="price" type="number" min=".01" step=".01" inputmode="decimal" placeholder="49.99"></label><button id="save">Save product / record price</button><p id="message" role="status"></p></div><div class="panel"><h2>My products</h2><button id="export">Export backup</button><div id="list"></div></div><script src="./price-watch.js" defer></script></body></html>
